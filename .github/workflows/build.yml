name: Build CSSE

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: csse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release / Win32
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify standalone sources
        run: python scripts/verify.py

      - name: Test load-order rules and rollback
        run: ./scripts/test-order.ps1

      - name: Build CSSE only
        run: ./scripts/build.ps1 -Configuration Release -BuildNumber '${{ github.run_number }}'

      - name: Verify x86 DLL and runtime imports
        run: python scripts/verify.py --binary build/Release/CSSE.dll

      - name: Package DLL, resources and separate symbols
        run: ./scripts/package.ps1 -Configuration Release

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: CSSE-Release-Win32
          path: dist/Release/*
          if-no-files-found: error
          retention-days: 30
