name: Build CSSE

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: csse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.configuration }} / Win32
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify standalone sources
        run: python scripts/verify.py

      - name: Build CSSE only
        run: ./scripts/build.ps1 -Configuration '${{ matrix.configuration }}' -BuildNumber '${{ github.run_number }}'

      - name: Verify x86 DLL and runtime imports
        run: python scripts/verify.py --binary 'build/${{ matrix.configuration }}/CSSE.dll'

      - name: Package DLL, resources and separate symbols
        run: ./scripts/package.ps1 -Configuration '${{ matrix.configuration }}'

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: CSSE-${{ matrix.configuration }}-Win32
          path: dist/${{ matrix.configuration }}/*
          if-no-files-found: error
          retention-days: 30
